<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1520" />
      <stop offset="100%" stop-color="#03070d" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Circuit Ring / Hex Border -->
  <circle cx="16" cy="16" r="15" fill="#03070d" stroke="#00f5ff" stroke-width="0.8" stroke-dasharray="3,1.5" opacity="0.6" />

  <!-- Cyber Shield Base -->
  <path d="M16 3 L26 6.8 C26 15 21.5 23.5 16 27 C10.5 23.5 6 15 6 6.8 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#cyberGrad)" 
        stroke-width="1.6" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Shield Inner Tech Core Line -->
  <path d="M16 6 L23.5 9 C23.5 15.5 19.8 21.8 16 24.5 C12.2 21.8 8.5 15.5 8.5 9 Z" 
        fill="none" 
        stroke="#00f5ff" 
        stroke-width="0.6" 
        stroke-dasharray="2,2" 
        opacity="0.4" />

  <!-- Central Digital Lock / Terminal Core -->
  <!-- Lock Shackle -->
  <path d="M13 13 V11 C13 9.3 14.3 8 16 8 C17.7 8 19 9.3 19 11 V13" 
        fill="none" 
        stroke="#00ff88" 
        stroke-width="1.4" 
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="11.5" y="13" width="9" height="7.5" rx="1.8" fill="#0a1f26" stroke="#00f5ff" stroke-width="1" />

  <!-- Keyhole / Glowing Core -->
  <circle cx="16" cy="16" r="1.1" fill="#00ff88" />
  <path d="M15.5 16.8 L16.5 16.8 L16.8 18.5 L15.2 18.5 Z" fill="#00ff88" />

  <!-- Cyber Circuit Node Dots -->
  <circle cx="16" cy="4" r="0.8" fill="#00f5ff" />
  <circle cx="25" cy="7" r="0.7" fill="#00ff88" />
  <circle cx="7" cy="7" r="0.7" fill="#00ff88" />
  <circle cx="16" cy="26" r="0.8" fill="#a855f7" />
</svg>
